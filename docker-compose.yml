services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: scalo
      POSTGRES_PASSWORD: scalo_dev_password
      POSTGRES_DB: scalo
    ports:
      - "5433:5432" # 5433 to avoid clashing with a local Postgres on 5432
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scalo -d scalo"]
      interval: 3s
      timeout: 3s
      retries: 20
volumes:
  pgdata:
