name: Idea / feature request
description: Suggest an improvement — please open an issue before writing code for a feature
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: The situation and who is affected, rather than the solution.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would you like to see?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives or workarounds you considered
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Funnels and page builder
        - Emails and deliverability
        - Contacts, CRM, segments
        - Automations
        - Payments
        - Courses and members area
        - Affiliate program
        - AI and MCP server
        - Public API and OAuth
        - Self-hosting and operations
        - Migration from another tool
        - Other
  - type: checkboxes
    id: contribute
    attributes:
      label: Contribution
      options:
        - label: I would like to work on this myself (see CONTRIBUTING.md)
