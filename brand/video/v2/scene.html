const prog = (t, a, d) => clamp((t - a) / d);
const eOut = (k) => 1 - Math.pow(1 - k, 3);
const eInOut = (k) => (k < 0.5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2);
const eBack = (k, c1 = 1.7) => { const c3 = c1 + 1; return 1 + c3 * Math.pow(k - 1, 3) + c1 * Math.pow(k - 1, 2); };
/** keyframes [[t, v], …] with ease-in-out between them */
function kf(t, keys) {
  if (t <= keys[0][0]) return keys[0][1];
  for (let i = 1; i < keys.length; i++) if (t < keys[i][0]) return lerp(keys[i - 1][1], keys[i][1], eInOut(prog(t, keys[i - 1][0], keys[i][0] - keys[i - 1][0])));
  return keys[keys.length - 1][1];
}
/** soft pop: scale + fade, used for everything that appears */
function pop(e, t, a, { d = 0.45, from = 0.86, dy = 18 } = {}) {
  const k = prog(t, a, d), s = lerp(from, 1, eBack(k));

// Ana's tags
const TAGS = [['webinar', 12.8, 'var(--lime)', 'var(--ink)'], ['call booked', 21.6, 'var(--i100)', 'var(--i700)'], ['customer', 24.6, 'var(--ink)', 'var(--lime)']].map(([n, at, bg, fg]) => {
  const s = document.createElement('span'); s.className = 'chip'; s.style.cssText = `font-size:20px;padding:6px 14px;background:${bg};color:${fg};transform-origin:0 50%`; s.textContent = n; $('anaTags').appendChild(s); return { s, at };
});
// the thousand others
const R = rnd(42);
const crowd = Array.from({ length: 90 }, (_, i) => ({ e: el('crowd', `width:64px;height:64px;margin:-32px 0 0 -32px;border-radius:32px;border:6px solid #fff;background:${['var(--i500)', 'var(--i300)', 'var(--i400)', 'var(--lime)', 'var(--ink)'][i % 5]}`), lag: i * 78 + R() * 50, dy: (R() - 0.5) * 150, v: 0.9 + R() * 0.2 }));
const STATS = [['Sign-ups', 1000, ''], ['Calls booked', 212, ''], ['Sales', 86, ''], ['Revenue', 25542, '$']].map(([k, v, pre]) => {
  const e = el('stats', '', `<div class="n big"></div><div class="k">${k}</div>`, ''); return { e, n: e.querySelector('.n'), v, pre };
});

// ------------------------------------------------------------------ one frame
function render(t) {
  // Ana travels, the camera follows
  const ax = kf(t, [[3.0, 420], [4.4, X[0]], [5.6, X[0]], [7.0, X[1]], [14.2, X[1]], [15.4, X[2]], [18.4, X[2]], [19.6, X[3]], [22.4, X[3]], [23.5, X[4]]]);
  const ay = pathY(ax);
  const cx = kf(t, [[2.4, 420], [3.8, 900], [4.4, X[0]], [5.6, X[0]], [7.0, X[1]], [14.2, X[1]], [15.4, X[2]], [18.4, X[2]], [19.6, X[3]], [22.4, X[3]], [23.5, X[4]], [OVERVIEW, X[4]], [27.0, 3550]]);
  const cy = kf(t, [[2.4, 700], [3.8, 520], [10.4, 520], [11.0, 480], [13.6, 480], [14.2, 520], [OVERVIEW, 520], [27.0, 420]]);
  const z = kf(t, [[2.4, 1.6], [3.8, 1], [10.4, 1], [11.0, 1.2], [13.6, 1.2], [14.2, 1], [OVERVIEW, 1], [27.0, 0.263]]) * (1 + Math.max(0, t - 27) * 0.004);
  $('world').style.transform = `translate(${960 - cx * z}px, ${540 - cy * z}px) scale(${z})`;
  const over = prog(t, OVERVIEW + 0.4, 1.2);

  // journey line + stations
  $('pathClip').style.width = (t < CROWD ? ax : lerp(ax, 6900, eInOut(prog(t, CROWD, 1.2)))) + 'px';
  nodes.forEach((n, i) => {
    const k = eBack(prog(t, DONE[i], 0.4), 2.4), on = t >= DONE[i];
    n.ring.style.background = on ? 'var(--ok)' : '#fff'; n.ring.style.borderColor = on ? 'var(--ok)' : 'var(--i300)';
    n.ring.style.transform = `scale(${(on ? 0.7 + 0.3 * k : 1) * lerp(1, 2.4, over)})`;
    n.stem.style.opacity = 1 - over;
  });
  labels.forEach((l, i) => pop(l, t, 26.3 + i * 0.12, { dy: 60 }));

  // Ana
  const a = $('ana'), ak = eBack(prog(t, 0.4, 0.5), 2.6), pulse = 1 + 0.06 * Math.sin(t * 5);
  a.style.left = ax + 'px'; a.style.top = ay + 'px'; a.style.transform = `scale(${Math.max(0.001, ak) * pulse * lerp(1, 1.6, over)})`;
  const L = $('anaL'); L.style.left = ax - 26 + 'px'; L.style.top = ay - 112 + 'px';
  const lk = eBack(prog(t, 1.3, 0.45)); L.style.transform = `scale(${Math.max(0.001, lk)})`; L.style.opacity = clamp(lk * 3) * (1 - over);
  TAGS.forEach(({ s, at }) => { const k = eBack(prog(t, at, 0.4), 2.6); s.style.display = t >= at ? 'inline-flex' : 'none'; s.style.transform = `scale(${Math.max(0.001, k)})`; });

  // 1 · post: cursor comes in, clicks the link
  pop($('c1'), t, 2.9);
  const ck = eInOut(prog(t, 3.5, 0.7)), press = t > 4.25 && t < 4.42;
  Object.assign($('cur').style, { left: lerp(1500, 1010, ck) + 'px', top: lerp(760, 520, ck) + 'px', opacity: clamp((t - 3.4) * 4) * (1 - prog(t, 4.9, 0.3)), transform: `scale(${press ? 0.84 : 1})` });
  $('c1link').style.borderColor = t > 4.3 ? 'var(--i500)' : 'var(--i100)';
  const rk = prog(t, 4.3, 0.6); Object.assign($('c1rip').style, { left: '250px', top: '330px', opacity: rk > 0 && rk < 1 ? 1 - rk : 0, transform: `scale(${0.3 + rk * 1.6})` });

  // 2 · landing page builds itself, then Ana signs up
  pop($('c2'), t, 5.9);
  pop($('c2hero'), t, 7.7, { dy: 30 }); pop($('c2img'), t, 8.15, { dy: 30 }); pop($('c2form'), t, 8.6, { dy: 30 });
  $('c2url').textContent = t < 9.1 ? 'scalo.app/p/free-guide' : typed('yourbrand.com/free-guide', prog(t, 9.1, 0.8));
  const mk = prog(t, 11.0, 1.0); $('c2mail').textContent = typed('ana@studio.co', mk);
  $('c2mail').style.color = 'var(--ink)'; $('c2in').style.borderColor = t > 10.9 && t < 12.2 ? 'var(--i500)' : 'var(--n200)';
  $('c2caret').style.opacity = t > 10.9 && t < 12.2 && Math.floor(t * 3) % 2 === 0 ? 1 : 0;
  const sent = t >= 12.2, bp = t > 12.1 && t < 12.28;
  Object.assign($('c2btn').style, { background: sent ? 'var(--ok)' : 'var(--i500)', transform: `scale(${bp ? 0.92 : 1})` }); $('c2btn').innerHTML = sent ? CHECK + '&nbsp;You’re in' : 'Get it';

  // 3 · emails go out on their own
  mails.forEach((m, i) => {
    pop(m, t, 14.6 + i * 0.14, { dy: 40 });
    const at = MAILS[i][2], k = eBack(prog(t, at, 0.4), 2.4), st = m.querySelector('.st');
    st.style.transform = `scale(${Math.max(0.001, k)})`; st.style.opacity = clamp(k * 3);
    m.style.borderColor = t >= at && t < at + 0.5 ? 'var(--i500)' : 'var(--n200)';
  });

  // 4 · she books a call
  pop($('c4'), t, 18.6);
  days.forEach((d, i) => { const on = i === 3 && t >= 20.9; d.style.background = on ? 'var(--i500)' : '#fff'; d.style.borderColor = on ? 'var(--i500)' : 'var(--n200)'; d.style.color = on ? '#fff' : 'var(--ink)'; d.querySelector('.mono').style.color = on ? '#fff' : 'var(--n500)'; });
  slots.forEach((s, i) => { const on = i === 1 && t >= 21.2; s.style.background = on ? 'var(--ink)' : '#fff'; s.style.borderColor = on ? 'var(--ink)' : 'var(--n200)'; s.style.color = on ? '#fff' : 'var(--ink)'; });
  const okk = eBack(prog(t, 21.5, 0.4), 2.4); $('c4ok').style.transform = `scale(${Math.max(0.001, okk)})`; $('c4ok').style.opacity = clamp(okk * 3);

  // 5 · she buys
  pop($('c5'), t, 22.6);
  const paid = t >= 24.5, pp = t > 24.2 && t < 24.4;
  Object.assign($('c5btn').style, { background: paid ? 'var(--ok)' : 'var(--ink)', transform: `scale(${pp ? 0.94 : 1})` }); $('c5btn').innerHTML = paid ? CHECK + 'Paid' : 'Pay $297';
  const gk = prog(t, 24.5, 0.8); Object.assign($('c5ring').style, { opacity: gk > 0 && gk < 1 ? (1 - gk) * 0.8 : 0, transform: `scale(${0.4 + gk * 1.8})` });

  // a thousand more
  crowd.forEach((c) => {
    const x = 200 + (t - CROWD) * 2500 * c.v - c.lag, on = t >= CROWD && x > 200;
    const xx = Math.min(x, 6900), fade = 1 - clamp((x - 6900) / 300);
    Object.assign(c.e.style, { left: xx + 'px', top: pathY(xx) + c.dy + 'px', opacity: on ? clamp((x - 200) / 200) * fade : 0 });
  });
  const sk = eOut(prog(t, CROWD + 0.2, 2.6));
  STATS.forEach((s, i) => { pop(s.e, t, CROWD + i * 0.12, { dy: 40 }); s.n.textContent = s.pre + fmt(s.v * sk); });
  $('stats').style.opacity = t < CROWD ? 0 : 1;

  // day counter
  const day = t < 3 ? '' : t < 5.6 ? 'Tuesday · 9:02 am' : t < 16.0 ? 'Day 0' : t < 16.8 ? 'Day 2' : t < 22.4 ? 'Day 5' : 'Day 9';
  $('hud').textContent = day; $('hud').style.opacity = (day ? clamp((t - 3) * 3) : 0) * (1 - over);

  // end card
  const ek = prog(t, END, 0.7); $('end').style.opacity = eInOut(ek); $('end').style.display = ek > 0 ? 'block' : 'none';
  const lg = eOut(prog(t, END + 0.2, 0.9)); $('logo').style.transform = `scale(${lerp(0.9, 1, lg) + Math.max(0, t - END) * 0.004})`; $('logo').style.opacity = lg;
  document.querySelectorAll('.lp').forEach((p, i) => { const k = eBack(prog(t, END + 0.45 + i * 0.14, 0.5), 2.2); p.style.transform = `translateY(${(1 - k) * 14}px)`; p.style.opacity = clamp(k * 3); });
  pop($('etag'), t, 32.6, { d: 0.6, from: 0.96, dy: 30 });
  pop($('ecta'), t, 34.0, { d: 0.5, from: 0.85, dy: 30 });

  // captions
  const line = CAPTIONS && LINES.find(([a, d]) => t >= a - 0.1 && t < a + d + 0.55);
  if (line) { const k = eOut(prog(t, line[0] - 0.1, 0.25)) * (1 - prog(t, line[0] + line[1] + 0.35, 0.2)); $('cap').innerHTML = `<span>${line[2]}</span>`; $('cap').style.opacity = k; $('cap').style.transform = `translateY(${(1 - k) * 14}px)`; }
  else $('cap').innerHTML = '';
}
window.DURATION = DURATION;
window.render = render;
window.ready = document.fonts.ready.then(() => { render(0); return true; });
if (location.search.includes('play')) { const t0 = performance.now(); const loop = () => { render(((performance.now() - t0) / 1000) % DURATION); requestAnimationFrame(loop); }; document.fonts.ready.then(loop); }
</script>
</body>
</html>
